# Cấu hình cổng chạy ứng dụng Web Server
server.port=8080

# Cấu hình kết nối cơ sở dữ liệu MySQL (hỗ trợ nạp biến môi trường DB_PORT cho máy PC/Docker)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/old_book_store_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình View Engine Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Giới hạn kích thước tệp tải lên (ảnh bìa sách, ảnh kiểm định)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# Cấu hình dịch vụ lưu trữ ảnh đám mây Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api_key=${CLOUDINARY_API_KEY:1234567890}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:secret}

# Cấu hình cổng thanh toán điện tử VNPay Sandbox
vnpay.tmn_code=${VNPAY_TMN_CODE:DEMO123}
vnpay.hash_secret=${VNPAY_HASH_SECRET:DEMOSECRETKEY}
vnpay.pay_url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return_url=http://localhost:8080/checkout/vnpay-return
