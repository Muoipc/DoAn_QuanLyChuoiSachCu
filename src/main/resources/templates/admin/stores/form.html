<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/admin-layout :: adminLayout(~{::title}, ~{::content})}">
<head>
    <title th:text="${isEdit ? 'Chỉnh Sửa Chi Nhánh' : 'Thêm Chi Nhánh Mới'}">Quản Lý Chi Nhánh</title>
</head>
<body>
<div th:fragment="content">

    <!-- PAGE HEADER -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="fw-bold mb-1" th:text="${isEdit ? 'Chỉnh Sửa Chi Nhánh: ' + store.storeName : 'Thêm Chi Nhánh Cửa Hàng Mới'}">Thêm Chi Nhánh</h4>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0 small">
                    <li class="breadcrumb-item"><a th:href="@{/admin/stores}">Chuỗi Chi Nhánh</a></li>
                    <li class="breadcrumb-item active" th:text="${isEdit ? 'Chỉnh sửa' : 'Thêm mới'}">Thêm mới</li>
                </ol>
            </nav>
        </div>
        <a th:href="@{/admin/stores}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i>Quay lại danh sách
        </a>
    </div>

    <!-- MAIN FORM -->
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom">
                <div class="card-header">
                    <i class="fa-solid fa-store text-primary me-2"></i>Thông Tin Chi Nhánh Cửa Hàng
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/stores/save}" th:object="${store}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên Chi Nhánh <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{storeName}" placeholder="Ví dụ: Chi Nhánh 1: Thủ Đức (Gần HCMUTE)" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Số Điện Thoại Hotline <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{phone}" placeholder="028 3722 1223" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email Liên Hệ</label>
                                <input type="email" class="form-control" th:field="*{email}" placeholder="thuduc@oldbookstore.vn">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Địa Chỉ Chi Tiết <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{address}" placeholder="Số 48 Võ Văn Ngân, Phường Linh Chiểu" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Tỉnh / Thành Phố <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{province}" value="TP. Hồ Chí Minh" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Quận / Huyện / TP Thủ Đức <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{district}" placeholder="TP. Thủ Đức / Quận 1..." required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Giờ Mở Cửa</label>
                                <input type="text" class="form-control" th:field="*{openTime}" placeholder="08:00">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Giờ Đóng Cửa</label>
                                <input type="text" class="form-control" th:field="*{closeTime}" placeholder="21:30">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quản Lý Chi Nhánh (Store Manager)</label>
                            <select class="form-select" th:field="*{manager}">
                                <option value="">-- Chưa chỉ định quản lý --</option>
                                <option th:each="user : ${managers}" th:value="${user.id}" th:text="${user.fullName + ' (' + user.username + ')'}"></option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Ảnh Mặt Tiền Cửa Hàng</label>
                            <div th:if="${isEdit and store.image != null}" class="mb-2">
                                <img th:src="${store.image}" class="rounded border" style="max-height: 140px; object-fit: cover;">
                            </div>
                            <input type="file" name="imageFile" class="form-control" accept="image/*">
                            <small class="text-muted">Ảnh sẽ được lưu trữ tự động trên đám mây Cloudinary.</small>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" th:field="*{isActive}" id="activeSwitch">
                            <label class="form-check-label fw-semibold" for="activeSwitch">Chi nhánh đang mở cửa hoạt động</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/stores}" class="btn btn-light px-4">Hủy</a>
                            <button type="submit" class="btn btn-theme px-4">
                                <i class="fa-solid fa-floppy-disk me-1"></i>Lưu Chi Nhánh
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
