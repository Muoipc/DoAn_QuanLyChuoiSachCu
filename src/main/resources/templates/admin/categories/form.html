<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/admin-layout :: adminLayout(~{::title}, ~{::content})}">
<head>
    <title th:text="${isEdit ? 'Chỉnh Sửa Danh Mục' : 'Thêm Danh Mục Mới'}">Danh Mục Thể Loại</title>
</head>
<body>
<div th:fragment="content">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="fw-bold mb-1" th:text="${isEdit ? 'Chỉnh Sửa Danh Mục: ' + category.categoryName : 'Thêm Danh Mục Thể Loại Mới'}">Danh Mục</h4>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0 small">
                    <li class="breadcrumb-item"><a th:href="@{/admin/categories}">Danh mục</a></li>
                    <li class="breadcrumb-item active" th:text="${isEdit ? 'Chỉnh sửa' : 'Thêm mới'}">Thêm mới</li>
                </ol>
            </nav>
        </div>
        <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i>Quay lại danh sách
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card card-custom">
                <div class="card-header">
                    <i class="fa-solid fa-layer-group text-primary me-2"></i>Thông Tin Thể Loại Sách
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/categories/save}" th:object="${category}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên Thể Loại <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{categoryName}" placeholder="Ví dụ: Công Nghệ Thông Tin &amp; Lập Trình" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Mã Slug (Để trống tự sinh)</label>
                                <input type="text" class="form-control" th:field="*{slug}" placeholder="cntt-lap-trinh">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">FontAwesome Icon Class</label>
                                <input type="text" class="form-control" th:field="*{icon}" placeholder="fa-laptop-code">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mô Tả Chuyên Mục</label>
                            <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Sách chuyên ngành công nghệ, giáo trình kỹ sư..."></textarea>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" th:field="*{isActive}" id="activeSwitch">
                            <label class="form-check-label fw-semibold" for="activeSwitch">Hiển thị trên menu và bộ lọc sách</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                            <a th:href="@{/admin/categories}" class="btn btn-light px-4">Hủy</a>
                            <button type="submit" class="btn btn-theme px-4">
                                <i class="fa-solid fa-floppy-disk me-1"></i>Lưu Danh Mục
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
