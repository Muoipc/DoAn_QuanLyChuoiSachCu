<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/admin-layout :: adminLayout(~{::title}, ~{::content})}">
<head>
    <title>Quản Lý Thể Loại Sách Cũ</title>
</head>
<body>
<div th:fragment="content">

    <!-- PAGE HEADER -->
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <h4 class="fw-bold mb-1"><i class="fa-solid fa-layer-group text-warning me-2"></i>Danh Mục Thể Loại Sách</h4>
            <p class="text-muted small mb-0">Quản lý các chuyên mục thể loại sách cũ (Văn học, CNTT, Kinh tế, Lịch sử, Giáo trình HCMUTE...).</p>
        </div>
        <a th:href="@{/admin/categories/create}" class="btn btn-theme">
            <i class="fa-solid fa-plus me-1"></i>Thêm Danh Mục Mới
        </a>
    </div>

    <!-- TABLE -->
    <div class="card card-custom">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr class="small text-muted text-uppercase">
                            <th class="ps-4">Tên Thể Loại</th>
                            <th>Mã Slug</th>
                            <th>Icon</th>
                            <th>Mô tả</th>
                            <th class="text-center">Trạng Thái</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${categories.empty}">
                            <td colspan="6" class="text-center py-4 text-muted">Chưa có danh mục nào.</td>
                        </tr>
                        <tr th:each="c : ${categories}">
                            <td class="ps-4 fw-bold text-dark">
                                <i class="fa-solid me-2 text-primary" th:classappend="${c.icon != null ? c.icon : 'fa-book'}"></i>
                                <span th:text="${c.categoryName}">Văn Học</span>
                            </td>
                            <td><code th:text="${c.slug}">van-hoc</code></td>
                            <td><span class="badge bg-light text-dark border" th:text="${c.icon}">fa-book</span></td>
                            <td class="small text-muted" th:text="${c.description}">Mô tả chuyên mục</td>
                            <td class="text-center">
                                <form th:action="@{/admin/categories/toggle-active/{id}(id=${c.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm" th:classappend="${c.isActive ? 'btn-success' : 'btn-outline-secondary'}" style="font-size: 11px; padding: 2px 8px;">
                                        <span th:text="${c.isActive ? 'Hoạt động' : 'Tạm ẩn'}">Hoạt động</span>
                                    </button>
                                </form>
                            </td>
                            <td class="text-end pe-4">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{/admin/categories/edit/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-pen-to-square"></i></a>
                                    <a th:href="@{/admin/categories/delete/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Bạn muốn xóa danh mục này?');"><i class="fa-solid fa-trash-can"></i></a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
