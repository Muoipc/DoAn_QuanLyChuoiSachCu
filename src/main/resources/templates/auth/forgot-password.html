<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Quên Mật Khẩu</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h4 class="card-title text-center fw-bold mb-2">Quên Mật Khẩu</h4>
                    <p class="text-center text-muted small mb-3">
                        Nhập địa chỉ email tài khoản của bạn để nhận mã OTP đặt lại mật khẩu.
                    </p>

                    <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Địa chỉ Email</label>
                            <input type="email" th:field="*{email}" class="form-control" autofocus placeholder="name@example.com">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2">Gửi Mã OTP Đặt Lại</button>
                    </form>

                    <div class="text-center mt-3 small">
                        Nhớ mật khẩu? <a th:href="@{/login}" class="text-decoration-none fw-semibold">Quay lại Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
