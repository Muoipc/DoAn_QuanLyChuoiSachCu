<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Đặt Lại Mật Khẩu</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h4 class="card-title text-center fw-bold mb-2">Đặt Lại Mật Khẩu</h4>
                    <p class="text-center text-muted small mb-3">
                        Nhập mã OTP 6 số và mật khẩu mới cho tài khoản của bạn.
                    </p>

                    <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

                    <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Địa chỉ Email</label>
                            <input type="email" th:field="*{email}" class="form-control" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Mã OTP (6 chữ số)</label>
                            <input type="text" th:field="*{otpCode}" class="form-control text-center fs-5" maxlength="6" autofocus placeholder="123456">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('otpCode')}" th:errors="*{otpCode}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Mật khẩu mới</label>
                            <input type="password" th:field="*{newPassword}" class="form-control" placeholder="Tối thiểu 6 ký tự">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Xác nhận mật khẩu mới</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu mới">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2">Cập Nhật Mật Khẩu</button>
                    </form>

                    <div class="text-center mt-3 small">
                        <a th:href="@{/login}" class="text-decoration-none fw-semibold">Quay lại Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
