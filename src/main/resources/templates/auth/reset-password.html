<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Đặt Lại Mật Khẩu — Chuỗi Cửa Hàng Sách Cũ TP.HCM</title>
    <!-- APPLE LIQUID GLASS DESIGN SYSTEM (iOS 26 / macOS) -->
    <link rel="stylesheet" href="/css/liquid-glass.css">
    <style>
        .auth-card-glass {
            border-radius: 24px !important;
            background: rgba(255, 255, 255, 0.88) !important;
            backdrop-filter: blur(32px) saturate(190%) brightness(103%) !important;
            -webkit-backdrop-filter: blur(32px) saturate(190%) brightness(103%) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.95) !important;
            box-shadow: 0 24px 60px rgba(45, 24, 15, 0.18), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.98) !important;
        }
        .auth-input, .form-control {
            border-radius: 12px !important;
            border: 1px solid rgba(0, 0, 0, 0.1) !important;
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            padding: 12px 16px !important;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }
        .auth-input:focus, .form-control:focus {
            background: #ffffff !important;
            border-color: #8C4A27 !important;
            box-shadow: 0 0 0 3.5px rgba(140, 74, 39, 0.14) !important;
        }
        .btn-auth-primary {
            background: linear-gradient(135deg, #8C4A27 0%, #6B3416 100%) !important;
            color: #ffffff !important;
            border: 1.5px solid rgba(255, 255, 255, 0.35) !important;
            border-radius: 9999px !important;
            font-weight: 800 !important;
            box-shadow: 0 6px 20px rgba(140, 74, 39, 0.32), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.4) !important;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .btn-auth-primary:hover {
            background: linear-gradient(135deg, #733615 0%, #52270f 100%) !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 10px 26px rgba(140, 74, 39, 0.45) !important;
        }
        .btn-auth-primary:active {
            transform: scale(0.97) !important;
        }
        .otp-icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(140, 74, 39, 0.1);
            color: #8C4A27;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 12px;
            border: 1.5px solid rgba(140, 74, 39, 0.2);
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-4">
        <div class="col-md-6 col-lg-5">
            <div class="auth-card-glass auth-box auth-form-card p-4 p-md-5 my-2">
                <div class="text-center">
                    <div class="otp-icon-wrap">
                        <i class="fa-solid fa-lock-open"></i>
                    </div>
                    <h3 class="fw-bold mb-2 text-dark" style="font-size: 22px;">Đặt Lại Mật Khẩu</h3>
                    <p class="text-muted small mb-4">
                        Nhập mã OTP 6 số và mật khẩu mới để phục hồi tài khoản của bạn.
                    </p>
                </div>

                <div th:if="${successMessage}" class="alert alert-success py-2 small rounded-3" th:text="${successMessage}"></div>

                <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Địa chỉ Email</label>
                        <input type="email" th:field="*{email}" class="form-control auth-input" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Mã OTP (6 chữ số)</label>
                        <input type="text" th:field="*{otpCode}" class="form-control auth-input text-center fs-4 fw-bold" maxlength="6" autofocus placeholder="• • • • • •" style="letter-spacing: 6px;">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('otpCode')}" th:errors="*{otpCode}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Mật khẩu mới</label>
                        <input type="password" th:field="*{newPassword}" class="form-control auth-input" placeholder="Tối thiểu 6 ký tự">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Xác nhận mật khẩu mới</label>
                        <input type="password" th:field="*{confirmPassword}" class="form-control auth-input" placeholder="Nhập lại mật khẩu mới">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>

                    <button type="submit" class="btn btn-auth-primary w-100 py-3">
                        <i class="fa-solid fa-check me-2"></i> Cập Nhật Mật Khẩu
                    </button>
                </form>

                <div class="text-center mt-4 small text-secondary">
                    <a th:href="@{/login}" class="text-decoration-none fw-bold" style="color: #8C4A27;">
                        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại Đăng nhập
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
    <script src="/js/i18n.js"></script>
    <script src="/js/cart-popover.js"></script>
</body>
</html>
