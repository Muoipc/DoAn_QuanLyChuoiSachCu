<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Đăng Ký Tài Khoản</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h4 class="card-title text-center fw-bold mb-2">Đăng Ký Tài Khoản</h4>
                    <p class="text-center text-muted small mb-3">Mã OTP kích hoạt sẽ được gửi tới Email của bạn</p>

                    <form th:action="@{/register}" th:object="${registerDTO}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Tên đăng nhập</label>
                            <input type="text" th:field="*{username}" class="form-control" placeholder="Nhập tên đăng nhập...">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Địa chỉ Email</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Họ và tên</label>
                            <input type="text" th:field="*{fullName}" class="form-control" placeholder="Nguyễn Văn A">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Số điện thoại</label>
                            <input type="text" th:field="*{phone}" class="form-control" placeholder="0901234567">
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Mật khẩu</label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="Tối thiểu 6 ký tự">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Xác nhận mật khẩu</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2">Đăng Ký & Nhận Mã OTP</button>
                    </form>

                    <div class="text-center mt-3 small">
                        Đã có tài khoản? <a th:href="@{/login}" class="text-decoration-none fw-semibold">Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
