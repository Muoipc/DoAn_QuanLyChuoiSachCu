<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Chuỗi Cửa Hàng Sách Cũ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- APPLE LIQUID GLASS DESIGN SYSTEM (claudiusnoc/liquid-glass-design-system) -->
    <link rel="stylesheet" href="/css/liquid-glass.css">
    <style>
        :root {
            --primary-color: #2b3a4a;
            --accent-color: #c97a3e;
            --bg-light: #f9f7f1;
        }
        body {
            background-color: var(--bg-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            flex: 1;
        }
        .book-card {
            border: 1px solid #e2ded5;
            background: #fff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }
        .condition-badge {
            background-color: #2e7d32;
            color: #fff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
        }
    
        /* DROPDOWN CHỌN NGÔN NGỮ CHUẨN SHOPEE TOPBAR */
        .lang-dropdown-box {
            position: relative;
            display: inline-block;
        }
        .lang-trigger-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-weight: 700;
            color: #292524;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.15s ease;
        }
        .lang-trigger-btn:hover {
            color: #8C4A27;
            background: rgba(140, 74, 39, 0.08);
        }
        .lang-dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: #ffffff;
            border-radius: 4px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            border: 1px solid #E8DEC8;
            min-width: 145px;
            display: none;
            z-index: 1000;
            padding: 6px 0;
        }
        .lang-dropdown-box:hover .lang-dropdown-menu {
            display: block;
        }
        .lang-item-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            font-size: 13px;
            color: #1C1917;
            cursor: pointer;
            transition: background 0.15s;
            font-weight: 600;
            text-decoration: none;
        }
        .lang-item-btn:hover {
            background: #F5ECE4;
            color: #8C4A27;
        }

    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-content py-4">
        <div class="container" layout:fragment="content">
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/cart-popover.js"></script>
</body>
</html>
